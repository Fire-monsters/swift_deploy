services:
  image: swift-deploy-1-node:latest
  port: 3000
  mode: canary
  version: "1.0.0"
  restart_policy: unless-stopped
  log_volume: app_logs   # named volume for logs

nginx:
  image: nginx:latest
  port: 8080
  proxy_timeout: 30      # seconds

network:
  name: swiftdeploy-net
  driver_type: bridge
