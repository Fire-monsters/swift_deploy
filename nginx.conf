upstream app_backend {
    server app:3000;
}

server {
    listen 8080;

    # Timeouts from manifest
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Required headers
    add_header X-Deployed-By swiftdeploy always;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Forward X-Mode header from upstream (canary mode)
        proxy_pass_header X-Mode;
    }

    # JSON error pages
    error_page 502 = @error502;
    error_page 503 = @error503;
    error_page 504 = @error504;

    location @error502 {
        default_type application/json;
        return 502 '{"error":"Bad Gateway","code":502,"service":"app","contact":"admin@swiftdeploy.local"}';
    }
    location @error503 {
        default_type application/json;
        return 503 '{"error":"Service Unavailable","code":503,"service":"app","contact":"admin@swiftdeploy.local"}';
    }
    location @error504 {
        default_type application/json;
        return 504 '{"error":"Gateway Timeout","code":504,"service":"app","contact":"admin@swiftdeploy.local"}';
    }
}