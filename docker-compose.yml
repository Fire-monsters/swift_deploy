# GENERATED BY swiftdeploy — DO NOT EDIT MANUALLY

networks:
  swiftdeploy-net:
    driver: bridge

volumes:
  app_logs:

services:

  app:
    image: swift-deploy-1-node:latest
    restart: unless-stopped
    environment:
      - MODE=canary
      - APP_VERSION=1.0.0
      - APP_PORT=3000
    networks:
      - swiftdeploy-net
    volumes:
      - app_logs:/app/logs
    # Note: port NOT exposed directly (all traffic through nginx)
    cap_drop:
      - ALL              # Drop all Linux capabilities (security)
    cap_add:
      - NET_BIND_SERVICE # Only add back what's needed
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - swiftdeploy-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy